<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRecall Trivia - Knowledge Memory Game</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.6rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
      margin-bottom: 4px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .status-bar {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .status-flex {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .timer-box, .stat-box {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-value {
      color: var(--accent);
      font-size: 1.2rem;
      font-family: monospace;
      font-weight: bold;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 10px;
    }

    .cards-grid::-webkit-scrollbar {
      width: 5px;
    }
    .cards-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .card-number {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(245, 158, 11, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .card-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin-top: 10px;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .card-content {
      font-size: 0.85rem;
      line-height: 1.3;
    }

    .card-title {
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 3px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 25px 20px;
      border-radius: 18px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 1.15rem;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-option:active {
      background: var(--primary);
    }

    .quiz-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 16px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .question-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .opt-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      line-height: 1.3;
    }

    .opt-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: var(--success) !important;
      color: #6ee7b7;
    }

    .opt-btn.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: var(--danger) !important;
      color: #fca5a5;
    }

    .feedback-message {
      min-height: 20px;
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .end-screen {
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 30px 20px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }

    .score-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 10px 0;
    }

    .quote-box {
      font-style: italic;
      color: #cbd5e1;
      margin: 15px 0 25px 0;
      font-size: 0.9rem;
      line-height: 1.5;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
    }

    .author-info {
      font-size: 0.85rem;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

        <div class="stat-box">⭐ Poin: <span id="score-display" style="color: var(--accent);">0</span></div>

    </div>

    <div id="memorize-phase">

    <div id="recall-phase" class="hidden">

        <div class="options-grid" id="options-container"></div>
        <div class="feedback-message" id="feedback"></div>
      </div>
    </div>

    <div id="end-phase" class="hidden">
      <div class="end-screen">
        <h2 id="end-title">Game Selesai!</h2>
        <p style="margin-top: 8px; color: var(--text-sub); font-size: 0.9rem;">Poin Akhir Anda:</p>
        <div class="score-display" id="final-score">0</div>
        
        <div class="quote-box" id="quote-text">"Kata-kata motivasi..."</div>

        <button class="btn" id="btn-restart" style="padding: 12px 24px; font-size: 1rem;">
          🔄 Ulang Game
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="ready-modal">
    <div class="modal-card">
      <h3 class="modal-title">Apakah kalian siap lanjut ke fase recall?</h3>
      <div class="modal-buttons">
        <button class="btn-option" onclick="startRecallPhase()">A. SIAPPPP BANGETT</button>
        <button class="btn-option" onclick="startRecallPhase()">B. SIAP</button>
      </div>
    </div>
  </div>

      Muhamad Fatih Sopwanudin<br>

    function renderCards() {
      cardsContainer.innerHTML = '';
      knowledgeData.forEach(item => {

        card.className = 'card';
        card.innerHTML = `

          <img src="${item.img}" class="card-img" alt="icon">
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div>${item.ans}</div>
          </div>

        cardsContainer.appendChild(card);
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        memorizeTime--;
        updateTimerDisplay();

        if (memorizeTime <= 0) {
          clearInterval(timerInterval);
          showReadyModal();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(memorizeTime / 60);
      const seconds = memorizeTime % 60;
      timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    btnReady.addEventListener('click', showReadyModal);

    function showReadyModal() {
      readyModal.classList.add('active');
    }

    function startRecallPhase() {
      readyModal.classList.remove('active');
      clearInterval(timerInterval);

      const shuffledData = [...knowledgeData].sort(() => 0.5 - Math.random());
      recallQuestions = shuffledData.slice(0, 20);

      memorizePhaseEl.classList.add('hidden');
      memorizeStatusEl.classList.add('hidden');
      recallPhaseEl.classList.remove('hidden');
      recallStatusEl.classList.remove('hidden');
      phaseTitleEl.textContent = "Fase Recall: Uji Daya Ingatmu!";

      loadQuestion();
    }

    function loadQuestion() {
      feedbackEl.textContent = "";
      const currentQ = recallQuestions[currentQuestionIndex];

      questionNumberEl.textContent = `Pertanyaan ${currentQuestionIndex + 1}/20`;
      qImgEl.src = currentQ.img;
      qTxtEl.textContent = `Nomor #${currentQ.id}: Apa jawaban/fakta tentang "${currentQ.title}"?`;

      optionsContainer.innerHTML = '';
      const shuffledOpts = [...currentQ.opts].sort(() => 0.5 - Math.random());

      shuffledOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(opt, currentQ.ans, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedOpt, correctAns, selectedBtn) {
      const allBtns = optionsContainer.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      if (selectedOpt === correctAns) {
        selectedBtn.classList.add('correct');
        score += 10;
        scoreDisplay.textContent = score;
        feedbackEl.style.color = "var(--success)";
        feedbackEl.textContent = "✨ Jawaban Benar! (+10 Poin)";
      } else {
        selectedBtn.classList.add('wrong');
        lives--;
        livesDisplay.textContent = lives;
        
        allBtns.forEach(btn => {
          if (btn.textContent === correctAns) {
            btn.classList.add('correct');
          }
        });

        feedbackEl.style.color = "var(--danger)";
        feedbackEl.textContent = `❌ Salah! Jawaban benar: ${correctAns}`;
      }

      setTimeout(() => {
        if (lives <= 0) {
          endGame(false);
        } else {
          currentQuestionIndex++;
          if (currentQuestionIndex < recallQuestions.length) {
            loadQuestion();
          } else {
            endGame(true);
          }
        }
      }, 2000);
    }

    function endGame(isCompleted) {
      recallPhaseEl.classList.add('hidden');
      recallStatusEl.classList.add('hidden');
      endPhaseEl.classList.remove('hidden');
      phaseTitleEl.textContent = "Hasil Akhir Permainan";

      document.getElementById('end-title').textContent = isCompleted ? "🎉 Selamat! Permainan Selesai" : "💥 Game Over (Nyawa Habis)";
      finalScoreEl.textContent = score;

      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      quoteTextEl.textContent = randomQuote;
    }

    btnRestart.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
