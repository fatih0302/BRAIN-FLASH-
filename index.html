<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAIN FLASH - MEMORIZE AND RECALL</title>

    <style>
        /* [Style Sebelumnya Tetap Sama, Hanya Ditambah CSS Hint] */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 35%, #0284c7 60%, #fef08a 85%, #fde047 100%); color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px; position: relative; overflow-x: hidden; }
        
        /* CSS Tambahan untuk Efek Lampu Ijo */
        .hint-highlight {
            border: 4px solid #22c55e !important;
            box-shadow: 0 0 15px #22c55e !important;
            transform: scale(1.05);
            background: #f0fdf4 !important;
        }

        /* [Sisa CSS Tetap Sama Sesuai Versi Sebelumnya] */
        .beach-bg-element { position: fixed; pointer-events: none; z-index: 1; opacity: 0.7; }
        .sun { top: -20px; right: -20px; width: 80px; height: 80px; background: #facc15; border-radius: 50%; box-shadow: 0 0 40px #fde047, 0 0 80px #facc15; }
        .main-wrapper { width: 100%; max-width: 960px; display: flex; flex-direction: column; align-items: center; z-index: 2; }
        .header-section { text-align: center; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        h1 { font-size: 1.6rem; color: #0369a1; text-shadow: 2px 2px 0px #ffffff; letter-spacing: 1px; }
        .ticker-wrap { width: 100%; background: rgba(255, 255, 255, 0.92); border: 2px solid #0284c7; border-radius: 10px; overflow: hidden; margin-bottom: 10px; display: flex; align-items: center; }
        .ticker-title { background: #0284c7; color: white; padding: 5px 12px; font-weight: bold; font-size: 0.78rem; }
        .dashboard { display: flex; width: 100%; justify-content: center; gap: 15px; background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 16px; border: 2px solid #facc15; margin-bottom: 10px; }
        .start-screen { display: flex; flex-direction: column; align-items: center; background: rgba(255, 255, 255, 0.98); border: 3px solid #38bdf8; border-radius: 20px; padding: 22px 16px; max-width: 440px; width: 100%; text-align: center; margin-top: 10px; }
        .grid-container, .slot-grid, .card-pool { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; margin-bottom: 10px; }
        .memo-card { background: #fff; border: 2px solid #38bdf8; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; min-height: 90px; }
        .memo-card:hover { transform: translateY(-4px); border-color: #0284c7; }
        .btn-help { background: #facc15; color: #713f12; border: 2px solid #ca8a04; padding: 6px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-action { background: #0284c7; color: white; border: none; padding: 10px 24px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .slot-box { background: #fff; border: 2px solid #38bdf8; border-radius: 12px; min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(2, 132, 199, 0.7); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #fff; border-radius: 20px; padding: 20px; text-align: center; max-width: 350px; }
        .footer-credit { margin-top: 20px; text-align: center; font-size: 0.75rem; color: #0369a1; font-weight: 600; }
        .card-disabled { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <!-- [Elemen UI Tetap Sama, Hanya Mengubah Fungsi JS] -->
    <div class="beach-bg-element sun"></div>

    <div class="main-wrapper">
        <div class="header-section"><h1>BRAIN FLASH - MEMORIZE AND RECALL</h1></div>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h2 style="color: #0369a1; margin-bottom: 10px;">🏝️ BRAIN FLASH 🏝️</h2>
            <button class="btn-action" onclick="startGame()">START GAME 🐚</button>
        </div>

        <!-- Dashboard & Game Screens (Hidden initially) -->
        <div class="dashboard" id="dashboardBox" style="display: none;">
            <span id="timer-display">Waktu: 2:00</span>
        </div>

        <div class="grid-container" id="memoGrid" style="display: none;"></div>

        <div id="recallSection" style="display: none; width: 100%;">
            <div class="help-cards-container" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
                <button class="btn-help" id="btnUndo" onclick="useUndoHelp()">Undo (2 sisa)</button>
                <button class="btn-help" id="btnHint" onclick="useHintHelp()">Petunjuk (2 sisa)</button>
            </div>
            <div class="card-pool" id="cardPool"></div>
            <div class="slot-grid" id="slotGrid"></div>
            <div style="text-align: center;" id="verifyBtnContainer"><button class="btn-action" onclick="finishGame()">CEK JAWABAN</button></div>
        </div>
        
        <div style="display: none; margin-top: 20px;" id="postReviewPlayAgainContainer">
            <button class="btn-action" style="background:#facc15; color:#713f12;" onclick="resetToStart()">Main Lagi 🔄</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="modalTitle">Game Selesai</h2>
            <button onclick="reviewAnswers()">Lihat Jawaban</button>
        </div>
    </div>

    <script>
        // Database & State
        const memoryDatabase = [ /* ...Data Pahlawan/Trivia Tetap Sama... */ ];
        let timer = 120;
        let timerInterval = null;
        let placedCards = new Array(30).fill(null);
        let currentNextSlot = 0;
        
        // Kuota Bantuan (Sekarang 2)
        let undoCount = 2;
        let hintCount = 2;

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('memoGrid').style.display = 'grid';
            document.getElementById('dashboardBox').style.display = 'flex';
            // Logic build grid... (Sama seperti sebelumnya)
        }

        // --- Fungsi Baru: Reset ke Start Tanpa Reload ---
        function resetToStart() {
            clearInterval(timerInterval);
            // Sembunyikan semua section
            document.getElementById('memoGrid').style.display = 'none';
            document.getElementById('recallSection').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'none';
            document.getElementById('resultModal').style.display = 'none';
            document.getElementById('postReviewPlayAgainContainer').style.display = 'none';
            
            // Reset Variable
            placedCards = new Array(30).fill(null);
            currentNextSlot = 0;
            undoCount = 2;
            hintCount = 2;
            
            // Tampilkan kembali Start Screen
            document.getElementById('startScreen').style.display = 'flex';
        }

        // --- Fungsi Baru: Hint Lampu Ijo ---
        function useHintHelp() {
            if (hintCount <= 0 || currentNextSlot >= 30) return;
            
            // Hapus highlight sebelumnya jika ada
            document.querySelectorAll('.hint-highlight').forEach(el => el.classList.remove('hint-highlight'));

            // Cari ID kartu yang seharusnya di slot berikutnya
            const targetId = currentNextSlot + 1;
            const cardEl = document.getElementById(`pool-card-${targetId}`);
            
            if (cardEl) {
                cardEl.classList.add('hint-highlight'); // Tambahkan kelas "Lampu Ijo"
                hintCount--;
                document.getElementById('btnHint').innerText = `Petunjuk (${hintCount} sisa)`;
            }
        }

        function useUndoHelp() {
            if (undoCount <= 0 || currentNextSlot === 0) return;
            undoCount--;
            document.getElementById('btnUndo').innerText = `Undo (${undoCount} sisa)`;
            // Logic undo... (Sama seperti sebelumnya)
        }

        // [Fungsi Lainnya seperti selectCardFromPool & reviewAnswers tetap dipertahankan]
    </script>
</body>
    </html>
