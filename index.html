<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRecall Extreme Hardcore</title>
  <!-- Load Iconify library untuk ikon yang pasti muncul & presisi -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg-gradient: linear-gradient(135deg, #050515 0%, #1a0b2e 50%, #091a2a 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(139, 92, 246, 0.3);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #fbbf24;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .container { width: 100%; max-width: 600px; margin: 0 auto; flex-grow: 1; }

    header { text-align: center; margin-bottom: 12px; }
    h1 { 
      font-size: 1.7rem; 
      background: linear-gradient(to right, #c084fc, #60a5fa); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    p.subtitle { color: var(--text-sub); font-size: 0.8rem; }

    .status-bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
    }

    .status-flex { display: flex; width: 100%; justify-content: space-between; align-items: center; }
    .timer-value { color: var(--danger); font-size: 1.4rem; font-weight: bold; font-family: monospace; }
    
    .btn {
      background: var(--primary); color: white; border: none; padding: 10px 18px;
      border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.96); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .card-num {
      position: absolute; top: 6px; left: 8px; font-size: 0.7rem; font-weight: bold; color: var(--accent);
    }

    .card-icon { font-size: 38px; color: #a78bfa; margin: 4px 0; }
    .card-title { font-weight: 700; color: #38bdf8; font-size: 0.8rem; margin-bottom: 2px; }
    .card-ans { font-size: 0.75rem; color: #f1f5f9; font-weight: 600; }

    .quiz-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .q-icon-large { font-size: 60px; color: #c084fc; margin-bottom: 10px; }
    .q-text { font-size: 0.95rem; font-weight: 700; margin-bottom: 15px; line-height: 1.4; color: #f1f5f9; }

    .options-grid { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: white; padding: 12px; border-radius: 10px; font-size: 0.85rem;
      text-align: left; cursor: pointer; font-weight: 500;
      transition: background 0.2s;
    }

    .opt-btn.correct { background: rgba(16, 185, 129, 0.35) !important; border-color: var(--success) !important; color: #6ee7b7; }
    .opt-btn.wrong { background: rgba(244, 63, 94, 0.35) !important; border-color: var(--danger) !important; color: #fca5a5; }

    .end-screen {
      text-align: center; background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 30px 20px; border-radius: 18px; backdrop-filter: blur(10px);
    }

    footer { text-align: center; margin-top: 15px; font-size: 0.8rem; color: var(--text-sub); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BrainRecall HARDCORE</h1>
      <p class="subtitle" id="phase-title">Fase Memorize: 2 Menit Menghafal!</p>
    </header>

    <div class="status-bar">
      <div id="memorize-ui" class="status-flex">
        <div>⏱️ Waktu: <span class="timer-value" id="timer">02:00</span></div>
        <button class="btn" id="btn-ready">SAYA SIAP!</button>
      </div>
      <div id="recall-ui" class="status-flex hidden">
        <div>❤️ Nyawa: <span id="lives" style="color: var(--danger); font-weight: bold; font-size: 1.1rem;">6</span></div>
        <div>⭐ Skor: <span id="score" style="color: var(--accent); font-weight: bold; font-size: 1.1rem;">0</span></div>
      </div>
    </div>

    <!-- FASE MEMORIZE -->
    <div id="memorize-phase" class="cards-grid"></div>

    <!-- FASE RECALL -->
    <div id="recall-phase" class="hidden quiz-box">
      <div id="q-number" style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px;">Soal 1/15</div>
      <div id="q-icon-box"><iconify-icon id="q-icon" class="q-icon-large" icon="mdi:help-circle"></iconify-icon></div>
      <div class="q-text" id="q-txt">Pertanyaan...</div>
      <div class="options-grid" id="options-container"></div>
      <div id="feedback" style="margin-top: 10px; font-size: 0.85rem; font-weight: bold; min-height: 20px;"></div>
    </div>

    <!-- FASE SELESAI -->
    <div id="end-phase" class="hidden end-screen">
      <h2 id="end-title">Game Selesai!</h2>
      <p style="color: var(--text-sub); margin-top: 5px;">Skor Akhir Anda:</p>
      <div style="font-size: 2.8rem; font-weight: 800; color: var(--accent); margin: 10px 0;" id="final-score">0</div>
      <button class="btn" onclick="location.reload()" style="padding: 12px 24px; font-size: 1rem;">🔄 Main Lagi</button>
    </div>
  </div>

  <footer>
    Muhamad Fatih Sopwanudin - SMAN 1 CIJERUK
  </footer>

  <script>
    // DATA DENGAN IKON SESUAI TOPIK LENGKAP
    const knowledgeData = [
      { id: 1, title: "Ibu Kota Baru Indonesia", ans: "Nusantara (IKN)", icon: "emojione-monotone:star" },
      { id: 2, title: "Planet Terbesar di Tata Surya", ans: "Yupiter", icon: "mdi:planet" },
      { id: 3, title: "Penemu Penemu Arus Listrik / Lampu", ans: "Thomas Edison", icon: "mdi:lightbulb" },
      { id: 4, title: "Lagu Kebangsaan Indonesia", ans: "Indonesia Raya", icon: "mdi:music" },
      { id: 5, title: "Rumus Gas Oksigen Kimia", ans: "O2", icon: "mdi:atom" },
      { id: 6, title: "Benua Terluas di Bumi", ans: "Asia", icon: "mdi:earth" },
      { id: 7, title: "Mata Uang Resmi Jepang", ans: "Yen", icon: "mdi:currency-jpy" },
      { id: 8, title: "Hewan Darat Tercepat", ans: "Cheetah", icon: "mdi:run-fast" },
      { id: 9, title: "Mamalia Terbesar di Dunia", ans: "Paus Biru", icon: "mdi:fish" },
      { id: 10, title: "Candi Buddha Terbesar", ans: "Borobudur", icon: "mdi:temple-buddhist" },
      { id: 11, title: "Monumen Nasional Jakarta", ans: "Monas", icon: "mdi:tower-fire" },
      { id: 12, title: "Sungai Terpanjang di Dunia", ans: "Sungai Nil", icon: "mdi:waves" },
      { id: 13, title: "Organ Pemompa Darah", ans: "Jantung", icon: "mdi:heart-pulse" },
      { id: 14, title: "Alat Pengukur Suhu", ans: "Termometer", icon: "mdi:thermometer" },
      { id: 15, title: "Gunung Tertinggi di Dunia", ans: "Mount Everest", icon: "mdi:image-filter-hdr" }
    ];

    let memorizeTime = 3 * 60; // Ditetapkan 3 Menit (180 Detik)
    let timerInterval = null;
    let score = 0;
    let lives = 6; // Ditetapkan 6 Nyawa
    let currentQIndex = 0;
    let questions = [];

    function initGame() {
      // Mengacak kartu saat diawali
      const shuffledData = [...knowledgeData].sort(() => 0.5 - Math.random());
      
      const container = document.getElementById('memorize-phase');
      container.innerHTML = '';
      
      shuffledData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-num">#${idx + 1}</div>
          <iconify-icon icon="${item.icon}" class="card-icon"></iconify-icon>
          <div class="card-title">${item.title}</div>
          <div class="card-ans">${item.ans}</div>
        `;
        container.appendChild(card);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        memorizeTime--;
        const m = Math.floor(memorizeTime / 60);
        const s = memorizeTime % 60;
        document.getElementById('timer').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (memorizeTime <= 0) {
          clearInterval(timerInterval);
          startRecallPhase();
        }
      }, 1000);
    }

    document.getElementById('btn-ready').onclick = startRecallPhase;

    function startRecallPhase() {
      clearInterval(timerInterval);
      document.getElementById('memorize-phase').classList.add('hidden');
      document.getElementById('memorize-ui').classList.add('hidden');
      document.getElementById('recall-phase').classList.remove('hidden');
      document.getElementById('recall-ui').classList.remove('hidden');
      document.getElementById('phase-title').textContent = "Fase Recall: Jawab dengan Teliti!";

      generateHardQuestions();
      loadQuestion();
    }

    // MEMBUAT SOAL-SOAL VARIASI KESULITAN TINGGI
    function generateHardQuestions() {
      const copy = [...knowledgeData].sort(() => 0.5 - Math.random());
      
      questions = copy.map(item => {
        const type = Math.floor(Math.random() * 3); 
        let qText = "";
        let correctOption = "";

        if (type === 0) {
          qText = `Sesuai memori kamu, apa fakta/jawaban dari: "${item.title}"?`;
          correctOption = item.ans;
        } else if (type === 1) {
          qText = `Pertanyaan mana yang tepat untuk jawaban: "${item.ans}"?`;
          correctOption = item.title;
        } else {
          qText = `Mengingat ikon di atas, fakta atau jawaban apa yang sesuai?`;
          correctOption = item.ans;
        }

        // Pengecoh jawaban dari data lain (Pilihan Ganda Susah)
        let options = [correctOption];
        while (options.length < 4) {
          const randItem = knowledgeData[Math.floor(Math.random() * knowledgeData.length)];
          const targetOpt = (type === 1) ? randItem.title : randItem.ans;
          if (!options.includes(targetOpt)) {
            options.push(targetOpt);
          }
        }

        options.sort(() => 0.5 - Math.random());

        return {
          icon: item.icon,
          text: qText,
          correct: correctOption,
          opts: options
        };
      });
    }

    function loadQuestion() {
      document.getElementById('feedback').textContent = '';
      const q = questions[currentQIndex];

      document.getElementById('q-number').textContent = `Soal ${currentQIndex + 1} dari ${questions.length}`;
      document.getElementById('q-icon').setAttribute('icon', q.icon);
      document.getElementById('q-txt').textContent = q.text;

      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';

      q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt, q.correct, btn);
        optsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedOpt, correctOpt, btn) {
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.disabled = true);

      const feedback = document.getElementById('feedback');

      if (selectedOpt === correctOpt) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        feedback.style.color = 'var(--success)';
        feedback.textContent = '✨ BENAR! (+10 Poin)';
      } else {
        btn.classList.add('wrong');
        lives--;
        document.getElementById('lives').textContent = lives;
        
        allBtns.forEach(b => {
          if (b.textContent === correctOpt) b.classList.add('correct');
        });

        feedback.style.color = 'var(--danger)';
        feedback.textContent = `❌ SALAH! Jawaban: ${correctOpt}`;
      }

      setTimeout(() => {
        if (lives <= 0) {
          endGame(false);
        } else {
          currentQIndex++;
          if (currentQIndex < questions.length) {
            loadQuestion();
          } else {
            endGame(true);
          }
        }
      }, 1400);
    }

    function endGame(isWin) {
      document.getElementById('recall-phase').classList.add('hidden');
      document.getElementById('recall-ui').classList.add('hidden');
      document.getElementById('end-phase').classList.remove('hidden');

      document.getElementById('end-title').textContent = isWin ? "🎉 LUAR BIASA! Kamu Berhasil Menang" : "💥 GAME OVER (Nyawa Habis)";
      document.getElementById('final-score').textContent = score;
    }

    initGame();
  </script>
</body>
  </html>
