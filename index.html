<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Memory Card Kuis (30 Kartu - High Level)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #38bdf8;
            text-align: center;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            background: #1e293b;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .stat-value {
            color: #f43f5e;
            font-size: 1.2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            max-width: 1000px;
            width: 100%;
            perspective: 1000px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }
        }

        @media (max-width: 500px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
        }

        .card {
            background-color: transparent;
            height: 110px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-size: 0.85rem;
            line-height: 1.2;
        }

        .card-front {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #3b82f6;
            color: #38bdf8;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .card-front::after {
            content: "❓";
            font-size: 1.8rem;
        }

        .card-back {
            background: #334155;
            color: #f8fafc;
            transform: rotateY(180deg);
            border: 2px solid #64748b;
            font-weight: 500;
            overflow-y: auto;
        }

        .card.matched .card-back {
            background: #065f46;
            border-color: #10b981;
            color: #a7f3d0;
        }

        .btn-reset {
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-reset:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .modal-body {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>🧠 Game Memory Kuis (Tingkat Sulit)</h1>
    <div class="subtitle">30 Kartu (15 Pasang Pertanyaan & Jawaban) | 4 Nyawa</div>

    <div class="dashboard">
        <div class="stat-box">❤️ Nyawa: <span id="lives-count" class="stat-value">❤️❤️❤️❤️</span></div>
        <div class="stat-box">🎯 Cocok: <span id="matches-count" style="color: #10b981;">0 / 15</span></div>
        <div class="stat-box">⏱️ Waktu: <span id="timer-count" style="color: #f59e0b;">0s</span></div>
    </div>

    <div class="grid-container" id="grid"></div>

    <button class="btn-reset" onclick="initGame()">🔄 Main Ulang / Reset</button>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">Game Over!</h2>
            <p class="modal-body" id="modalBody">Nyawa kamu habis!</p>
            <button class="btn-reset" onclick="initGame()">Coba Lagi</button>
        </div>
    </div>

    <script>
        // 15 Pasang Pertanyaan & Jawaban Tingkat Sulit
        const questionsData = [
            { id: 1, q: "❓ Prinsip Kimia Hijau ke-1?", a: "💡 Mencegah Timbulnya Limbah" },
            { id: 2, q: "❓ Turunan f(x) = sin³(2x)", a: "💡 6 sin²(2x) cos(2x)" },
            { id: 3, q: "❓ Persamaan Schrödinger Bebas Waktu", a: "💡 ĤΨ = EΨ" },
            { id: 4, q: "❓ Hukum II Termodinamika", a: "💡 Entropi Semesta Selalu Meningkat (ΔS ≥ 0)" },
            { id: 5, q: "❓ Katalis Utama Proses Haber-Bosch", a: "💡 Besi (Fe) + Promotor K₂O/Al₂O₃" },
            { id: 6, q: "❓ Orde Reaksi jika Waktu Paruh (t½) Konstan", a: "💡 Reaksi Orde 1" },
            { id: 7, q: "❓ Pelarut Hijau Pengganti Senyawa VOC", a: "💡 Karbondioksida Superkritis (scCO₂)" },
            { id: 8, q: "❓ Partikel Pembawa Gaya Nuklir Kuat", a: "💡 Gluon" },
            { id: 9, q: "❓ Rumus Tekanan Osmotik Larutan", a: "💡 π = M · R · T · i" },
            { id: 10, q: "❓ Efek Doppler jika Sumber Menjauhi", a: "💡 Frekuensi Terdengar Lebih Rendah (f' < f)" },
            { id: 11, q: "❓ Definisi Basa Bronsted-Lowry", a: "💡 Akseptor Proton (H⁺)" },
            { id: 12, q: "❓ Titik Stasioner f(x) = x³ - 3x", a: "💡 x = 1 dan x = -1" },
            { id: 13, q: "❓ Hukum Kepler III tentang Orbit", a: "💡 T² Berbanding Lurus dengan a³" },
            { id: 14, q: "❓ Gas Rumah Kaca Potensi Pemanasan Paling Tinggi", a: "💡 Sulfur Heksafluorida (SF₆)" },
            { id: 15, q: "❓ Hubungan Energi Foton & Frekuensi", a: "💡 E = h · f" }
        ];

        let cards = [];
        let flippedCards = [];
        let lives = 4;
        let matches = 0;
        let lockBoard = false;
        let timer = 0;
        let timerInterval = null;

        function startTimer() {
            clearInterval(timerInterval);
            timer = 0;
            document.getElementById('timer-count').innerText = "0s";
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer-count').innerText = timer + "s";
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function initGame() {
            stopTimer();
            startTimer();
            lives = 4;
            matches = 0;
            lockBoard = false;
            flippedCards = [];
            
            document.getElementById('lives-count').innerText = "❤️".repeat(lives);
            document.getElementById('matches-count').innerText = "0 / 15";
            document.getElementById('gameModal').style.display = "none";

            // Buat array 30 kartu (15 soal + 15 jawaban)
            let cardDeck = [];
            questionsData.forEach(item => {
                cardDeck.push({ pairId: item.id, text: item.q, type: 'q' });
                cardDeck.push({ pairId: item.id, text: item.a, type: 'a' });
            });

            // Acak kartu (Fisher-Yates Shuffle)
            for (let i = cardDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardDeck[i], cardDeck[j]] = [cardDeck[j], cardDeck[i]];
            }

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            cardDeck.forEach((data, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.pairId = data.pairId;
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">${data.text}</div>
                    </div>
                `;

                cardEl.addEventListener('click', () => flipCard(cardEl));
                grid.appendChild(cardEl);
            });
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;

            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                document.getElementById('matches-count').innerText = `${matches} / 15`;
                flippedCards = [];
                lockBoard = false;

                if (matches === 15) {
                    stopTimer();
                    setTimeout(() => showModal("🎉 Kemenangan Luar Biasa!", `Kamu berhasil mencocokkan semua 15 pasang soal sulit dalam waktu ${timer} detik dengan sisa ${lives} nyawa!`), 500);
                }
            } else {
                lives--;
                document.getElementById('lives-count').innerText = lives > 0 ? "❤️".repeat(lives) : "💀 Habis";

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;

                    if (lives === 0) {
                        stopTimer();
                        showModal("💥 Game Over!", `Nyawa kamu sudah habis! Kamu berhasil mencocokkan ${matches} dari 15 pasang soal.`);
                    }
                }, 1000);
            }
        }

        function showModal(title, body) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = body;
            document.getElementById('gameModal').style.display = "flex";
        }

        // Jalankan game saat halaman dimuat
        window.onload = initGame;
    </script>
</body>
  </html>
