<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainRecall Extreme Trivia</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; flex-grow: 1; }

    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 1.8rem; color: #fff; text-shadow: 0 0 12px var(--primary); letter-spacing: 0.5px; }
    p.subtitle { color: var(--text-sub); font-size: 0.85rem; }

    .status-bar {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .status-flex { display: flex; width: 100%; justify-content: space-between; align-items: center; }
    .timer-value { color: var(--accent); font-size: 1.3rem; font-weight: bold; font-family: monospace; }
    
    .btn {
      background: var(--primary); color: white; border: none; padding: 10px 18px;
      border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 58vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    .card-num {
      position: absolute; top: 5px; left: 8px; font-size: 0.7rem; font-weight: bold; color: var(--accent);
    }

    .card-img { width: 45px; height: 45px; object-fit: contain; margin: 6px 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
    .card-title { font-weight: 700; color: #818cf8; font-size: 0.85rem; margin-bottom: 2px; }
    .card-ans { font-size: 0.8rem; color: #f1f5f9; font-weight: 600; }

    .quiz-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .q-img-large { width: 70px; height: 70px; object-fit: contain; margin: 0 auto 12px; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
    .q-text { font-size: 1rem; font-weight: 700; margin-bottom: 15px; line-height: 1.4; color: #f1f5f9; }

    .options-grid { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: white; padding: 12px; border-radius: 10px; font-size: 0.9rem;
      text-align: left; cursor: pointer; font-weight: 500;
    }

    .opt-btn.correct { background: rgba(16, 185, 129, 0.3) !important; border-color: var(--success) !important; color: #6ee7b7; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.3) !important; border-color: var(--danger) !important; color: #fca5a5; }

    .end-screen {
      text-align: center; background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 30px 20px; border-radius: 18px; backdrop-filter: blur(10px);
    }

    footer { text-align: center; margin-top: 15px; font-size: 0.8rem; color: var(--text-sub); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BrainRecall Extreme</h1>
      <p class="subtitle" id="phase-title">Fase Memorize: Hafalkan Gambar & Fakta!</p>
    </header>

    <div class="status-bar">
      <div id="memorize-ui" class="status-flex">
        <div>⏱️ Sisa Waktu: <span class="timer-value" id="timer">05:00</span></div>
        <button class="btn" id="btn-ready">SAYA SIAP!</button>
      </div>
      <div id="recall-ui" class="status-flex hidden">
        <div>❤️ Nyawa: <span id="lives" style="color: var(--danger); font-weight: bold;">6</span></div>
        <div>⭐ Skor: <span id="score" style="color: var(--accent); font-weight: bold;">0</span></div>
      </div>
    </div>

    <!-- FASE MEMORIZE -->
    <div id="memorize-phase" class="cards-grid"></div>

    <!-- FASE RECALL -->
    <div id="recall-phase" class="hidden quiz-box">
      <div id="q-number" style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px;">Soal 1/20</div>
      <img id="q-img" class="q-img-large" src="" alt="Soal">
      <div class="q-text" id="q-txt">Pertanyaan...</div>
      <div class="options-grid" id="options-container"></div>
      <div id="feedback" style="margin-top: 10px; font-size: 0.85rem; font-weight: bold; min-height: 20px;"></div>
    </div>

    <!-- FASE SELESAI -->
    <div id="end-phase" class="hidden end-screen">
      <h2 id="end-title">Game Selesai!</h2>
      <p style="color: var(--text-sub); margin-top: 5px;">Skor Akhir Anda:</p>
      <div style="font-size: 2.8rem; font-weight: 800; color: var(--accent); margin: 10px 0;" id="final-score">0</div>
      <button class="btn" onclick="location.reload()" style="padding: 12px 24px; font-size: 1rem;">🔄 Coba Lagi</button>
    </div>
  </div>

  <footer>
    Muhamad Fatih Sopwanudin - SMAN 1 CIJERUK
  </footer>

  <script>
    // DATA DENGAN ICON VECTOR SESUAI TOPIK LENGKAP
    const knowledgeData = [
      { id: 1, title: "Ibu Kota Indonesia", ans: "Nusantara (IKN)", img: "https://cdn-icons-png.flaticon.com/512/330/330528.png" },
      { id: 2, title: "Planet Terbesar", ans: "Yupiter", img: "https://cdn-icons-png.flaticon.com/512/3594/3594270.png" },
      { id: 3, title: "Penemu Arus Listrik / Lampu", ans: "Thomas Edison", img: "https://cdn-icons-png.flaticon.com/512/702/702797.png" },
      { id: 4, title: "Lagu Kebangsaan RI", ans: "Indonesia Raya", img: "https://cdn-icons-png.flaticon.com/512/3074/3074058.png" },
      { id: 5, title: "Simbol Gas Oksigen", ans: "O2", img: "https://cdn-icons-png.flaticon.com/512/1043/1043431.png" },
      { id: 6, title: "Benua Terluas di Dunia", ans: "Asia", img: "https://cdn-icons-png.flaticon.com/512/814/814587.png" },
      { id: 7, title: "Mata Uang Negara Jepang", ans: "Yen", img: "https://cdn-icons-png.flaticon.com/512/330/330622.png" },
      { id: 8, title: "Hewan Darat Tercepat", ans: "Cheetah", img: "https://cdn-icons-png.flaticon.com/512/3069/3069172.png" },
      { id: 9, title: "Mamalia Terbesar di Bumi", ans: "Paus Biru", img: "https://cdn-icons-png.flaticon.com/512/2042/2042861.png" },
      { id: 10, title: "Candi Buddha Terbesar", ans: "Borobudur", img: "https://cdn-icons-png.flaticon.com/512/1000/1000868.png" },
      { id: 11, title: "Monumen Nasional di Jakarta", ans: "Monas", img: "https://cdn-icons-png.flaticon.com/512/2162/2162060.png" },
      { id: 12, title: "Sungai Terpanjang Dunia", ans: "Sungai Nil", img: "https://cdn-icons-png.flaticon.com/512/2913/2913520.png" },
      { id: 13, title: "Organ Pemompa Darah Utama", ans: "Jantung", img: "https://cdn-icons-png.flaticon.com/512/2545/2545191.png" },
      { id: 14, title: "Alat Pengukur Suhu Udara", ans: "Termometer", img: "https://cdn-icons-png.flaticon.com/512/1959/1959311.png" },
      { id: 15, title: "Gunung Tertinggi di Dunia", ans: "Mount Everest", img: "https://cdn-icons-png.flaticon.com/512/2913/2913008.png" },
      { id: 16, title: "Simbol Unsur Kimia Emas", ans: "Au", img: "https://cdn-icons-png.flaticon.com/512/2058/2058220.png" },
      { id: 17, title: "Satuan untuk Arus Listrik", ans: "Ampere", img: "https://cdn-icons-png.flaticon.com/512/616/616490.png" },
      { id: 18, title: "Proklamator Kemerdekaan RI", ans: "Soekarno - Hatta", img: "https://cdn-icons-png.flaticon.com/512/2910/2910791.png" },
      { id: 19, title: "Proses Tumbuhan Buat Makanan", ans: "Fotosintesis", img: "https://cdn-icons-png.flaticon.com/512/628/628283.png" },
      { id: 20, title: "Senyawa Kimia Air", ans: "H2O", img: "https://cdn-icons-png.flaticon.com/512/3105/3105807.png" }
    ];

    let memorizeTime = 5 * 60; // 5 Menit
    let timerInterval = null;
    let score = 0;
    let lives = 6;
    let currentQIndex = 0;
    let questions = [];

    function initGame() {
      // ACAK POSISI KARTU SETIAP KALI START
      const shuffledData = [...knowledgeData].sort(() => 0.5 - Math.random());
      
      const container = document.getElementById('memorize-phase');
      container.innerHTML = '';
      
      shuffledData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-num">#${idx + 1}</div>
          <img src="${item.img}" class="card-img" alt="icon">
          <div class="card-title">${item.title}</div>
          <div class="card-ans">${item.ans}</div>
        `;
        container.appendChild(card);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        memorizeTime--;
        const m = Math.floor(memorizeTime / 60);
        const s = memorizeTime % 60;
        document.getElementById('timer').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (memorizeTime <= 0) {
          clearInterval(timerInterval);
          startRecallPhase();
        }
      }, 1000);
    }

    document.getElementById('btn-ready').onclick = startRecallPhase;

    function startRecallPhase() {
      clearInterval(timerInterval);
      document.getElementById('memorize-phase').classList.add('hidden');
      document.getElementById('memorize-ui').classList.add('hidden');
      document.getElementById('recall-phase').classList.remove('hidden');
      document.getElementById('recall-ui').classList.remove('hidden');
      document.getElementById('phase-title').textContent = "Fase Recall: Jawab dengan Cepat & Tepat!";

      generateHardQuestions();
      loadQuestion();
    }

    // MEMBUAT SOAL-SOAL VARIASI DAN TINGKAT KESULITAN TINGGI
    function generateHardQuestions() {
      const copy = [...knowledgeData].sort(() => 0.5 - Math.random());
      
      questions = copy.map(item => {
        // Acak jenis tipe pertanyaan
        const type = Math.floor(Math.random() * 3); 
        let qText = "";
        let correctOption = "";
        let showImg = true;

        if (type === 0) {
          // Tipe 1: Tanya Jawaban dari Judul
          qText = `Apa jawaban/fakta dari: "${item.title}"?`;
          correctOption = item.ans;
        } else if (type === 1) {
          // Tipe 2: Tanya Judul dari Jawaban
          qText = `Pertanyaan mana yang menghasilkan jawaban: "${item.ans}"?`;
          correctOption = item.title;
        } else {
          // Tipe 3: Visual Memory Test (Tanpa sebut judul)
          qText = `Berdasarkan ikon gambar di atas, fakta/jawaban apa yang tepat?`;
          correctOption = item.ans;
        }

        // Pilihan Jawaban Pengecoh (Distractors)
        let options = [correctOption];
        while (options.length < 4) {
          const randItem = knowledgeData[Math.floor(Math.random() * knowledgeData.length)];
          const targetOpt = (type === 1) ? randItem.title : randItem.ans;
          if (!options.includes(targetOpt)) {
            options.push(targetOpt);
          }
        }

        options.sort(() => 0.5 - Math.random());

        return {
          img: item.img,
          text: qText,
          correct: correctOption,
          opts: options
        };
      });
    }

    function loadQuestion() {
      document.getElementById('feedback').textContent = '';
      const q = questions[currentQIndex];

      document.getElementById('q-number').textContent = `Soal ${currentQIndex + 1} dari ${questions.length}`;
      document.getElementById('q-img').src = q.img;
      document.getElementById('q-txt').textContent = q.text;

      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';

      q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt, q.correct, btn);
        optsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedOpt, correctOpt, btn) {
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.disabled = true);

      const feedback = document.getElementById('feedback');

      if (selectedOpt === correctOpt) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        feedback.style.color = 'var(--success)';
        feedback.textContent = '✨ BENAR! (+10 Poin)';
      } else {
        btn.classList.add('wrong');
        lives--;
        document.getElementById('lives').textContent = lives;
        
        allBtns.forEach(b => {
          if (b.textContent === correctOpt) b.classList.add('correct');
        });

        feedback.style.color = 'var(--danger)';
        feedback.textContent = `❌ SALAH! Jawaban: ${correctOpt}`;
      }

      setTimeout(() => {
        if (lives <= 0) {
          endGame(false);
        } else {
          currentQIndex++;
          if (currentQIndex < questions.length) {
            loadQuestion();
          } else {
            endGame(true);
          }
        }
      }, 1500);
    }

    function endGame(isWin) {
      document.getElementById('recall-phase').classList.add('hidden');
      document.getElementById('recall-ui').classList.add('hidden');
      document.getElementById('end-phase').classList.remove('hidden');

      document.getElementById('end-title').textContent = isWin ? "🎉 HEBAT! Kamu Menyelesaikan Semua Soal" : "💥 GAME OVER (Nyawa Habis)";
      document.getElementById('final-score').textContent = score;
    }

    initGame();
  </script>
</body>
  </html>
